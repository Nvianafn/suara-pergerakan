user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Do not log URLs: reset-password paths contain credentials and query
    # strings can contain personal information.
    log_format minimal '$request_method $status $body_bytes_sent $request_time';
    access_log /dev/stdout minimal;
    sendfile on;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    server {
        listen 8080;
        root /app/public;
        index index.php;
        client_max_body_size 45m;
        location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
        location / { try_files $uri $uri/ /index.php?$query_string; }
        location = /index.php {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /app/public/index.php;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_read_timeout 120s;
        }
        location ~ \.php$ { return 404; }
        location ~ /\. { deny all; }
    }
}
