name: Publish production image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Determine image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile
          load: true
          tags: suara-production:check
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify production runtime
        run: |
          docker run --rm suara-production:check nginx -t
          docker run --rm suara-production:check composer check-platform-reqs --no-dev
          docker run -d --name smoke -p 127.0.0.1:8085:8080 \
            -e APP_ENV=production -e APP_DEBUG=false -e LOG_CHANNEL=stderr \
            -e APP_KEY="base64:$(openssl rand -base64 32)" suara-production:check
          trap 'docker logs smoke; docker rm -f smoke' EXIT
          curl --fail --retry 20 --retry-delay 2 --retry-all-errors --max-time 10 http://127.0.0.1:8085/up
          curl --fail http://127.0.0.1:8085/healthz
      - name: Push verified image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          provenance: mode=min
      - name: Record release identity
        run: |
          echo '### Production image' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.image.outputs.name }}@${{ steps.publish.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Image publication completed; Azure deployment is a separate step.' >> "$GITHUB_STEP_SUMMARY"
