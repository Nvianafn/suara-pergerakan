services:
  app:
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000", "--no-reload"]
    build:
      context: .
      dockerfile: docker/development/Dockerfile
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - .:/app
      - vendor:/app/vendor
      - framework:/app/storage/framework
      - ./docker/development/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    environment:
      DB_CONNECTION: sqlsrv
      DB_HOST: sqlserver
      DB_PORT: 1433
      DB_DATABASE: suara_pergerakan
      DB_USERNAME: sa
      DB_PASSWORD: ${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD in your shell}
      DB_ENCRYPT: "yes"
      DB_TRUST_SERVER_CERTIFICATE: "true"
    depends_on:
      - sqlserver
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD in your shell}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
volumes:
  vendor:
  framework:
  sqlserver-data:
